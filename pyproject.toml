[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yield-curve-alm-engine"
version = "0.1.0"
description = "Stylized yield-curve and ALM analytics research lab."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Mathieu Jacquet" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
yield-curve-build-base = "yield_curve_alm_engine.scripts.build_base_case:main"
yield-curve-run-stress = "yield_curve_alm_engine.scripts.run_stress_tests:main"
yield-curve-build-dashboard = "yield_curve_alm_engine.scripts.build_alm_dashboard:main"
yield-curve-plot-results = "yield_curve_alm_engine.scripts.plot_results:main"
yield-curve-fetch-ecb = "yield_curve_alm_engine.scripts.fetch_ecb_curve:main"
yield-curve-generate-report = "yield_curve_alm_engine.scripts.generate_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
